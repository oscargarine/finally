[project]
name = "finally-backend"
version = "0.1.0"
description = "FinAlly backend (FastAPI) — market data, portfolio, watchlist and LLM chat."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# UP017: constitution P10 names `timezone.utc`; UP042: StrEnum changes str() output
ignore = ["UP017", "UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "demo_simulator.py"]
